[settings]
	maxDistance = 2.5
	maxEntityWidth = 1.5
	maxEntityHeight = 2.5
	blockSlownessMultiplier = 1.0
	entitySlownessMultiplier = 1.0
	maxEntityStackLimit = 2
	heavyTiles = true
	pickupAllBlocks = false
	slownessInCreative = true
	pickupHostileMobs = false
	heavyEntities = true
	allowBabies = false
	useWhitelistBlocks = false
	useWhitelistEntities = false
	useWhitelistStacking = false
	hitWhileCarrying = false
	# Being attacked should interrupt relocation instead of turning a carried
	# chest or animal into risk-free combat luggage.
	dropCarriedWhenHit = true
	useScripts = false
	# Stacking creatures is visually janky and creates avoidable transport and
	# collision exploits. Carrying one ordinary creature remains available.
	stackableEntities = false
	entitySizeMattersStacking = true
	placementStateExceptions = ["minecraft:chest[type]", "minecraft:stone_button[face]", "minecraft:vine[north,east,south,west,up]", "minecraft:creeper_head[rotation]", "minecraft:glow_lichen[north,east,south,west,up,down]", "minecraft:oak_sign[rotation]", "minecraft:oak_trapdoor[half]"]
	pickupPlayers = false
	pickupUnbreakableBlocks = false

[whitelist]
	allowedEntities = []
	allowedBlocks = []
	allowedStacking = []

[blacklist]
	# Lootr containers own per-player treasure state. Create contraptions,
	# portals, spawners, and campaign infrastructure must also stay put.
	forbiddenTiles = ["#forge:immovable", "#forge:relocation_not_supported", "minecraft:spawner", "minecraft:end_portal", "minecraft:end_gateway", "minecraft:nether_portal", "minecraft:piston_head", "minecraft:ender_chest", "minecraft:enchanting_table", "minecraft:*_bed", "minecraft:*_door", "lootr:*", "create:*", "sophisticatedstorage:*", "integrated_stronghold:*"]
	forbiddenEntities = ["minecraft:end_crystal", "minecraft:ender_dragon", "minecraft:ghast", "minecraft:shulker", "minecraft:leash_knot", "minecraft:armor_stand", "minecraft:item_frame", "minecraft:painting", "minecraft:shulker_bullet", "corpse:corpse", "artifacts:mimic", "mowziesmobs:*", "quark:totem"]
	forbiddenStacking = ["minecraft:*"]

[customPickupConditions]
	customPickupConditionsBlocks = []
	customPickupConditionsEntities = []
