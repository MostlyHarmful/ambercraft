[detection]
	# Broad enough to notice threats across a large Integrated Village without
	# turning every distant monster into a village-wide event.
	threatDetectionRadius = 24
	bellDetectionRadius = 96
	# Ten seconds between scans keeps the autonomous behavior inexpensive.
	scanCooldownTicks = 200
	artificialVillagePoiRadius = 96

[village]
	villageScope = "BOTH"
	# A bell defines an intentional settlement and prevents wilderness conversions.
	requireBell = true
	# Four guards gives a large village coverage without replacing iron golems or
	# making nighttime completely safe.
	maxEntitiesPerArea = 4
	entitySearchRadius = 96
	sharedCooldownRadius = 128

[conversion]
	convertNitwits = true
	convertUnemployed = true
	# Preserve established trades and professions.
	convertUntradedProfessionals = false
	allowSelfConversion = false
	# Village defense consumes a villager instead of creating population for free.
	spawnInsteadOfConvert = false
	exemptSameVillageAttackers = ["minecraft:villager", "minecraft:iron_golem", "guardvillagers:guard"]
	convertibleEntityIds = ["minecraft:villager"]

[effects]
	conversionParticlesEnabled = true
	conversionParticleDurationTicks = 40

[entity_pool]
	maxEntries = 10
	defaultChance = 1.0
	defaultMode = "CONVERT"
	defaultPriority = 1
	defaultDropLoot = false
	defaultCooldownTicks = 12000
	defaultVillageScope = "BOTH"
	defaultRequireBell = "TRUE"
	defaultMaxLimit = 4
	# entity/chance/mode/priority/dropLoot/cooldown/villageScope/requireBell/maxLimit/triggerEntityIds
	# Disabled: the 1.20.1 conversion rule repeatedly selected villagers despite
	# the configured area cap, producing runaway guards in large villages.
	entries = []
