
#Server Settings
[server]
	#Backpacks cannot contain shulker-style container items. This prevents
	#recursive portable storage while leaving ordinary Create integration intact.
	disallowedItems = []
	containerItemsDisallowed = true
	noInteractionBlocks = []
	noConnectionBlocks = []
	allBlockConnectionsDisallowed = false
	maxUpgradesPerStorage = ["stack_upgrades|1", "furnace_upgrades|1", "jukebox_upgrades|1"]
	itemFluidHandlerEnabled = true
	allowOpeningOtherPlayerBackpacks = false
	itemDisplayDisabled = false
	tickDedupeLogicDisabled = false
	canBePlacedInContainerItems = false

	[server.nerfs]
		# One expedition backpack is useful; carrying a stack of full portable
		# inventories should become progressively impractical.
		tooManyBackpacksSlowness = true
		maxNumberOfBackpacks = 1
		slownessLevelsPerAdditionalBackpack = 1.0
		onlyWornBackpackTriggersUpgrades = true
		nerfEffect = "minecraft:slowness"

	[server.leatherBackpack]
		inventorySlotCount = 27
		upgradeSlotCount = 1

	[server.copperBackpack]
		inventorySlotCount = 36
		upgradeSlotCount = 1

	[server.ironBackpack]
		inventorySlotCount = 45
		upgradeSlotCount = 2

	[server.goldBackpack]
		inventorySlotCount = 54
		upgradeSlotCount = 3

	[server.diamondBackpack]
		inventorySlotCount = 72
		upgradeSlotCount = 4

	[server.netheriteBackpack]
		inventorySlotCount = 81
		upgradeSlotCount = 5
