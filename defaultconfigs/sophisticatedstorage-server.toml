# Ambercraft uses Sophisticated Storage for compact, stationary warehouses.
# Stationary storage may combine up to three stack upgrades. This gives a
# purpose-built warehouse substantially more density than a backpack without
# replacing the physical routing and sorting work done by Create.
[server]
	maxUpgradesPerStorage = ["chest|stack_upgrades|3", "chest|cooking_upgrades|1", "chest|jukebox_upgrades|1", "barrel|stack_upgrades|3", "barrel|cooking_upgrades|1", "barrel|jukebox_upgrades|1", "shulker_box|stack_upgrades|0", "shulker_box|cooking_upgrades|0", "shulker_box|jukebox_upgrades|0", "limited_barrel|stack_upgrades|3", "limited_barrel|cooking_upgrades|1", "limited_barrel|jukebox_upgrades|1"]

	# Sophisticated shulker recipes are removed, but zero upgrade slots keep any
	# creative/admin-created examples from becoming superior portable backpacks.
	[server.ShulkerBox]
		upgradeSlotCount = 0

	[server.CopperShulkerBox]
		upgradeSlotCount = 0

	[server.IronShulkerBox]
		upgradeSlotCount = 0

	[server.GoldShulkerBox]
		upgradeSlotCount = 0

	[server.DiamondShulkerBox]
		upgradeSlotCount = 0

	[server.NetheriteShulkerBox]
		upgradeSlotCount = 0
